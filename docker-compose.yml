networks:
  caho:
    driver: bridge

services:
  redis:
    image: redis:latest
    container_name: caho-redis
    restart: always
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: caho
    # Expired-key events drive the Round timers (ADR-0003).
    command:
      [
        "redis-server",
        "--requirepass",
        "caho",
        "--notify-keyspace-events",
        "Ex",
      ]
    networks:
      - caho
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "caho", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    container_name: caho-postgres
    restart: always
    environment:
      POSTGRES_USER: caho
      POSTGRES_PASSWORD: caho
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - caho
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "caho"]
      interval: 10s
      timeout: 5s
      retries: 5

  seq:
    profiles: ["observability"]
    image: datalust/seq:latest
    container_name: caho-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_ADMINPASSWORD: caho
    ports:
      - "5341:80"
    volumes:
      - seq_data:/data
    networks:
      - caho

  # One-shot: apply migrations + seed the base card pack, then exit. The API
  # waits for it so it never boots against an empty schema or card pool.
  caho-migrate:
    container_name: caho-migrate
    image: caho-api:local
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/migrate.js"]
    restart: "no"
    env_file: ./.env.docker
    networks:
      - caho
    depends_on:
      postgres:
        condition: service_healthy

  caho-api:
    container_name: caho-api
    image: caho-api:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # The caho-migrate dependency already completed database setup.
    command: ["node", "dist/server.js"]
    env_file: ./.env.docker
    environment:
      SEQ_URL: ${SEQ_URL:-}
      SEQ_API_KEY: ${SEQ_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-caho-backend}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
    ports:
      - "8080:8080"
    networks:
      - caho
    depends_on:
      caho-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  seq_data:
